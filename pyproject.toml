[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe"
version = "0.1.0"
description = "LETHE: Model-driven fault localization with teams of LLM agents that forget"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "pytest",
  "coverage",
  "pandas",
  "scipy",
  "numpy",
  "pyyaml",
  "requests",
  "pyarrow",
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["lethe*", "evaluation*"]
