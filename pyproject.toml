[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lethe"
version = "0.1.0"
description = "LETHE: Model-driven fault localization with teams of LLM agents that forget"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "coverage>=7.5,<8",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "pyarrow>=15,<25",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6",
  "types-requests>=2",
]
java = ["tree-sitter>=0.21,<1", "tree-sitter-java>=0.21,<1"]

[project.scripts]
lethe = "lethe.cli:app"

[tool.setuptools.packages.find]
include = ["lethe*", "evaluation*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests", "evaluation/tests"]
markers = [
  "integration: exercises subprocesses or a benchmark checkout",
  "hpc: requires a Slurm compute allocation",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["evaluation/data", "evaluation/results", "hpc/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["lethe"]
exclude = "^(evaluation/data|evaluation/results|hpc/logs)/"
